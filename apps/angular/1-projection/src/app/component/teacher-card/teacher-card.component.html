<app-card
  [list]="teachers()"
  [type]="cardType"
  customClass="bg-light-red">
    <img ngSrc="assets/img/teacher.png" width="200" height="200" />

  <section>
    @for (item of teachers(); track item) {
      <app-list-item
        [name]="item.firstName"
        [id]="item.id"
        [type]="cardType"></app-list-item>
    }
  </section>

  
</app-card>
