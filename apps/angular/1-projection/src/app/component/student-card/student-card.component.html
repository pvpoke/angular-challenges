<app-card
    [list]="students()"
    [type]="cardType"
    customClass="bg-light-green">

    <img ngSrc="assets/img/student.webp" width="200" height="200" />

    <section>
    @for (item of students(); track item) {
        <app-list-item
        [name]="item.firstName"
        [id]="item.id"
        [type]="cardType"></app-list-item>
    }
    </section>
</app-card>
